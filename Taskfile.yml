version: "3"

vars:
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  BIN: '{{.BIN_DIR}}/rillan-skills'
  # Tool versions (mirror .github/workflows/ci.yml; bump together via Dependabot).
  GOLANGCI_LINT_VERSION: v2.12.2
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.5.0
  GOIMPORTS_VERSION: v0.47.0
  GORELEASER_VERSION: v2.16.0

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the rillan-skills installer binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -o {{.BIN}} ./cmd/rillan-skills
    sources:
      - "**/*.go"
      - go.mod
      - "skills/*/*.skill.md"
    generates:
      - "{{.BIN}}"

  vet:
    desc: Run go vet across the module
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run --timeout=5m

  fmt:
    desc: Apply goimports to the tree
    cmds:
      - go run golang.org/x/tools/cmd/goimports@{{.GOIMPORTS_VERSION}} -w -local github.com/rillanai/rillan-skills .

  fmt-check:
    desc: Fail if goimports would reformat any file
    cmds:
      - |
        out=$(go run golang.org/x/tools/cmd/goimports@{{.GOIMPORTS_VERSION}} -l .)
        if [ -n "$out" ]; then
          echo "goimports drift in:"
          echo "$out"
          echo "Run 'task fmt' to fix."
          exit 1
        fi

  staticcheck:
    desc: Run staticcheck
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@{{.STATICCHECK_VERSION}} ./...

  vuln:
    desc: Run govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  test:
    desc: Run unit tests with race detector and coverage
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...

  ci:
    desc: Run the same checks CI runs (lint, fmt, vet, test, staticcheck, vuln, build)
    cmds:
      - task: lint
      - task: fmt-check
      - task: vet
      - task: test
      - task: staticcheck
      - task: vuln
      - task: build

  install:
    desc: Install the binary into ~/.local/bin
    deps: [build]
    cmds:
      - install -m 0755 {{.BIN}} {{.HOME}}/.local/bin/rillan-skills
      - echo "installed to {{.HOME}}/.local/bin/rillan-skills"

  detect:
    desc: Run detection against the current directory (for development)
    deps: [build]
    cmds:
      - "{{.BIN}} detect --target ."

  list:
    desc: List all skills bundled in the binary
    deps: [build]
    cmds:
      - "{{.BIN}} list"

  release:check:
    desc: Validate the GoReleaser config without building
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} check

  release:snapshot:
    desc: Build a local snapshot release into dist/ (no tag, no publish)
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} dist
