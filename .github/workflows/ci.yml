name: ci

on:
  pull_request:
  push:
    branches: [main]

# Deny everything at the workflow root; jobs grant the minimum they need.
permissions: {}

# Cancel superseded PR runs but never cancel main-branch runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool versions. Bump via Dependabot.
  GOLANGCI_LINT_VERSION: v2.12.2
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.5.0
  GOIMPORTS_VERSION: v0.47.0

jobs:
  dco:
    name: DCO
    # Skip the bot-authored release-please PR: its commits carry no Signed-off-by
    # trailer and would otherwise block the release.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin "${BASE_REF}:${BASE_REF}"
          missing=0
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            if ! git log -1 --pretty=%B "$commit" | grep -qi '^Signed-off-by: '; then
              echo "::error::Missing Signed-off-by trailer on commit $commit"
              missing=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..HEAD")
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. Rebase/amend with: git commit --signoff" >&2
            exit 1
          fi

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run --timeout=5m

  fmt:
    name: Format check (goimports)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: goimports check
        shell: bash
        run: |
          set -Eeuo pipefail
          out=$(go run "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}" -l .)
          if [ -n "$out" ]; then
            echo "::error::goimports drift in the following files:"
            echo "$out"
            echo "Run 'task fmt' to fix."
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test (race + coverage)
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...

  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build -trimpath ./...

  summary:
    name: CI summary
    needs: [lint, fmt, test, staticcheck, vuln, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FMT_RESULT: ${{ needs.fmt.result }}
          TEST_RESULT: ${{ needs.test.result }}
          STATICCHECK_RESULT: ${{ needs.staticcheck.result }}
          VULN_RESULT: ${{ needs.vuln.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## CI Summary"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| lint        | ${LINT_RESULT} |"
            echo "| fmt         | ${FMT_RESULT} |"
            echo "| test        | ${TEST_RESULT} |"
            echo "| staticcheck | ${STATICCHECK_RESULT} |"
            echo "| vuln        | ${VULN_RESULT} |"
            echo "| build       | ${BUILD_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
