name: release

on:
  push:
    branches: [main]

# Deny everything at the workflow root; jobs grant the minimum they need.
permissions: {}

# Never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release-please maintains a release PR from Conventional Commits. Merging
  # that PR cuts the tag and the GitHub release, and sets release_created=true.
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # create the tag + GitHub release
      pull-requests: write  # maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GoReleaser runs in the SAME workflow run, only when release-please just cut
  # a release. It checks out that exact tag and uploads binaries to the existing
  # release (release.mode: keep-existing) — it never pushes or moves the tag,
  # which sidesteps both tag-protection rules and the GITHUB_TOKEN cascade limit.
  goreleaser:
    name: goreleaser
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # GoReleaser is pinned as a `go tool` directive in go.mod (single source of
      # truth), so run it via `go tool` rather than goreleaser-action's own
      # floating version.
      - name: GoReleaser
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
