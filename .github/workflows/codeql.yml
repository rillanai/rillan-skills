#
# CodeQL code scanning. Free for public repositories (no GitHub Advanced
# Security required) — a no-cost, native alternative to the paid Code Quality
# feature. Results appear under the repository's Security → Code scanning tab.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC

# Deny everything at the workflow root; the job grants the minimum it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write # upload code scanning results
      contents: read
      actions: read # required for the "actions" language analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # v3 (codeql-bundle-v2.25.6)
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # v3 (codeql-bundle-v2.25.6)
        with:
          category: "/language:${{ matrix.language }}"
